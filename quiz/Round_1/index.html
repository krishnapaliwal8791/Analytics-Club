<!DOCTYPE html>
<html>
<head>
  <title>Quiz Participant</title>

  <!-- Mobile responsiveness -->

  <!-- Theme CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h2>⚡ Analytics Quiz</h2>

    <!-- LOGIN -->

    </div>

    <!-- QUIZ -->
    <div id="quiz" style="display:none;">
      <div id="refreshBox">
  <button onclick="loadQuestion()">🔄 Check for Next Question</button>
</div>
      
      <div id="status"></div>
      <div id="options"></div>
    </div>

  </div>

  <!-- Supabase -->

  <!-- Your logic -->
  <script src="quiz.js"></script>

</body>
</html>
