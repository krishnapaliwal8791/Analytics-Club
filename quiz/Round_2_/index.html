<!DOCTYPE html>
<html>
<head>
  <title>Quiz Participant</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h2>⚡ Analytics Quiz</h2>

    <!-- LOGIN -->
    <div id="login">
      <input id="teamName" placeholder="Enter Team Name" />
      <button onclick="login()">Join</button>
    </div>

    <!-- QUIZ -->
    <div id="quiz" style="display:none;">

      <div id="refreshBox">
        <button onclick="loadQuestion()">🔄 Check for Next Question</button>
      </div>

      <div id="status"></div>

      <!-- QUESTION -->
      <div id="question"></div>

      <!-- ANSWER -->
      <div id="answerBox" style="display:none;">
        <input type="number" step="any" id="answer" placeholder="Enter answer" />
        <button onclick="submitAnswer()" id="submitBtn">Submit</button>
      </div>

    </div>

  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script>
    const supabaseObject = window.supabase.createClient(
      "https://ytrwmcyrcuhgtlltxxuw.supabase.co",
      "sb_publishable_M5xMF2Bue8fRZjczWsQUqw_8xAttOE5"
    );

    // 🔹 LOGIN
    function login() {
      const team = document.getElementById("teamName").value.trim();

      if (!team) {
        alert("Enter team name");
        return;
      }

      localStorage.setItem("team", team);

      document.getElementById("login").style.display = "none";
      document.getElementById("quiz").style.display = "block";
    }

    // 🔹 AUTO LOAD TEAM
    window.onload = () => {
      const saved = localStorage.getItem("team");

      if (saved) {
        document.getElementById("teamName").value = saved;
        document.getElementById("login").style.display = "none";
        document.getElementById("quiz").style.display = "block";
      }
    };

    // 🔹 LOAD QUESTION (renamed from fetchQuestion)
    async function loadQuestion() {
      const team = localStorage.getItem("team");
      const statusEl = document.getElementById("status");
      const questionEl = document.getElementById("question");
      const answerBox = document.getElementById("answerBox");

      if (!team) {
        statusEl.innerText = "Enter team name";
        return;
      }

      // fetch state
      const { data: stateData, error } = await supabaseObject
        .from("quiz_state")
        .select("*")
        .single();

      if (error) {
        statusEl.innerText = "Error fetching state";
        return;
      }

      const { status, active_question_id } = stateData;

      if (status === "waiting") {
        statusEl.innerText = "No active question";
        questionEl.innerText = "";
        answerBox.style.display = "none";
        return;
      }

      if (status === "closed") {
        statusEl.innerText = "Question closed";
        questionEl.innerText = "";
        answerBox.style.display = "none";
        return;
      }

      // fetch question
      const { data: questionData, error: qError } = await supabaseObject
        .from("questions")
        .select("*")
        .eq("id", active_question_id)
        .single();

      if (qError) {
        statusEl.innerText = "Question not found";
        return;
      }

      statusEl.innerText = "Question is active";
      questionEl.innerText = questionData.text;

      answerBox.style.display = "block";
      document.getElementById("submitBtn").disabled = false;

      // check duplicate submission
      const { data: existing } = await supabaseObject
        .from("submissions")
        .select("*")
        .eq("question_id", active_question_id)
        .eq("user_id", team);

      if (existing && existing.length > 0) {
        statusEl.innerText = "Already submitted";
        document.getElementById("submitBtn").disabled = true;
      }
    }

    // 🔹 SUBMIT ANSWER
    async function submitAnswer() {
      const team = localStorage.getItem("team");
      const answer = document.getElementById("answer").value;
      const statusEl = document.getElementById("status");
      const submitBtn = document.getElementById("submitBtn");

      if (!answer || isNaN(answer)) {
        statusEl.innerText = "Enter valid number";
        return;
      }

      const { data: stateData, error } = await supabaseObject
        .from("quiz_state")
        .select("*")
        .single();

      if (error) {
        statusEl.innerText = "Error checking state";
        return;
      }

      const { status, active_question_id } = stateData;

      if (status !== "active") {
        statusEl.innerText = "Question is no longer active";
        return;
      }

      const { error: insertError } = await supabaseObject
        .from("submissions")
        .insert([
          {
            question_id: active_question_id,
            user_id: team,
            answer: parseFloat(answer)
          }
        ]);

      if (insertError) {
        if (insertError.message.includes("duplicate")) {
          statusEl.innerText = "Already submitted";
        } else {
          statusEl.innerText = "Submission failed";
        }
        return;
      }

      statusEl.innerText = "Submitted successfully";
      submitBtn.disabled = true;
    }
  </script>

</body>
</html>
